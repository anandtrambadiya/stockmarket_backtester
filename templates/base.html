<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#070A0F"/>
  <title>{% block title %}NiftyML{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ═══════════════════════════════════════════════
       "AURORA TERMINAL" — unified design tokens
       Brand = electric blue→cyan. Emerald/rose = data only.
    ═══════════════════════════════════════════════ */
    :root{
      --bg:       #070A0F;
      --bg2:      #0A0E15;
      --bg3:      #121826;
      --surface:  #0D121C;
      --surface2: #111827;
      --border:   rgba(148,178,255,.10);
      --border2:  rgba(148,178,255,.20);
      --ink:      #F5F8FF;
      --ink2:     #E7ECF7;
      --text:     rgba(233,240,255,.90);
      --text2:    rgba(190,204,232,.60);
      --text3:    rgba(170,186,220,.34);

      /* brand */
      --brand:    #4C8DFF;
      --brand-2:  #38BDF8;
      --brand-3:  #22D3EE;
      --brand-bg: rgba(76,141,255,.10);
      --brand-bd: rgba(76,141,255,.32);
      --brand-glow: rgba(76,141,255,.35);

      /* data semantics */
      --up:       #34D399;
      --up-2:     #10B981;
      --up-bg:    rgba(52,211,153,.09);
      --up-bd:    rgba(52,211,153,.26);
      --down:     #FB7185;
      --down-bg:  rgba(251,113,133,.09);
      --down-bd:  rgba(251,113,133,.26);

      --mono:     'JetBrains Mono',monospace;
      --sans:     'Inter',sans-serif;
      --display:  'Sora','Inter',sans-serif;
      --radius:   16px;
      --radius-sm:11px;
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
      --shadow:   0 4px 16px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 18px 48px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
      --shadow-glow:0 0 0 1px var(--brand-bd),0 12px 48px var(--brand-glow);
      --nav-h:64px;
    }

    html,body{height:100%;scroll-behavior:smooth}
    body{
      background:var(--bg);color:var(--text);
      font-family:var(--sans);font-size:14px;line-height:1.6;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      position:relative;overflow-x:hidden;
    }
    h1,h2,h3,h4,.display{font-family:var(--display)}

    /* ── Global aurora background (fixed, behind everything) ── */
    .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .bg-grid{
      position:absolute;inset:0;
      background-image:
        linear-gradient(to right, rgba(148,178,255,.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148,178,255,.035) 1px, transparent 1px);
      background-size:56px 56px;
      mask-image:radial-gradient(ellipse 95% 65% at 50% 0%, #000 15%, transparent 78%);
      -webkit-mask-image:radial-gradient(ellipse 95% 65% at 50% 0%, #000 15%, transparent 78%);
    }
    .beam{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen}
    .beam.b1{width:640px;height:640px;left:-180px;top:-160px;
      background:radial-gradient(circle,rgba(76,141,255,.30),transparent 66%);animation:drift1 24s ease-in-out infinite}
    .beam.b2{width:560px;height:560px;right:-160px;top:24%;
      background:radial-gradient(circle,rgba(34,211,238,.20),transparent 66%);animation:drift2 30s ease-in-out infinite}
    .beam.b3{width:520px;height:520px;left:36%;bottom:-220px;
      background:radial-gradient(circle,rgba(56,189,248,.16),transparent 66%);animation:drift3 28s ease-in-out infinite}
    @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,80px) scale(1.08)}}
    @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-40px) scale(1.12)}}
    @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-60px) scale(1.06)}}

    /* ═══════════════ NAV ═══════════════ */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:500;
      height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;
      padding:0 32px;
      background:rgba(7,10,15,.68);
      backdrop-filter:blur(22px) saturate(180%);
      -webkit-backdrop-filter:blur(22px) saturate(180%);
      border-bottom:1px solid var(--border);
    }
    .nav-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
    .nav-logo-mark{
      width:32px;height:32px;border-radius:10px;
      background:linear-gradient(145deg,var(--brand),var(--brand-3));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 22px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.35);
    }
    .nav-logo-mark svg{display:block}
    .nav-logo-text{font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
    .nav-logo-text .ml{background:linear-gradient(90deg,var(--brand-2),var(--brand-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

    nav ul{display:flex;gap:4px;list-style:none;align-items:center}
    nav a{
      display:block;padding:8px 15px;border-radius:9px;
      font-size:13px;font-weight:500;color:var(--text2);
      text-decoration:none;transition:color .15s,background .15s;
    }
    nav a:hover{color:var(--ink);background:rgba(148,178,255,.07)}
    nav a.active{color:var(--ink);background:rgba(148,178,255,.09);font-weight:600}
    .nav-cta{
      background:linear-gradient(135deg,var(--brand),var(--brand-3))!important;color:#04070D!important;border-radius:9px;
      padding:8px 17px!important;font-weight:700!important;font-size:12px!important;
      box-shadow:0 0 22px var(--brand-glow);transition:transform .15s,box-shadow .15s!important;
    }
    .nav-cta:hover{transform:translateY(-1px);box-shadow:0 0 32px var(--brand-glow)!important;color:#04070D!important}

    .nav-burger{
      display:none;width:40px;height:40px;border-radius:10px;
      background:rgba(148,178,255,.06);border:1px solid var(--border);
      cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px;
    }
    .nav-burger span{width:16px;height:1.6px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .25s}
    .nav-burger.open span:nth-child(1){transform:translateY(5.6px) rotate(45deg)}
    .nav-burger.open span:nth-child(2){opacity:0}
    .nav-burger.open span:nth-child(3){transform:translateY(-5.6px) rotate(-45deg)}
    .mobile-panel{
      position:fixed;top:var(--nav-h);left:0;right:0;z-index:499;
      background:rgba(7,10,15,.97);backdrop-filter:blur(22px);
      border-bottom:1px solid var(--border);
      padding:16px 20px 22px;display:flex;flex-direction:column;gap:6px;
      transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s;
    }
    .mobile-panel.open{transform:translateY(0);opacity:1;pointer-events:auto}
    .mobile-panel a{
      padding:13px 15px;border-radius:10px;font-size:15px;font-weight:500;
      color:var(--text);text-decoration:none;background:rgba(148,178,255,.04);border:1px solid var(--border);
    }
    .mobile-panel a.active{border-color:var(--brand-bd);color:var(--brand-2)}

    main{padding-top:var(--nav-h);position:relative;z-index:1}

    /* ═══════════════ SHARED BUTTONS ═══════════════ */
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:11px 22px;border-radius:11px;font-size:13px;
      font-weight:600;font-family:var(--sans);cursor:pointer;
      text-decoration:none;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;
    }
    .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#04070D;box-shadow:0 0 24px var(--brand-glow)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 38px var(--brand-glow)}
    .btn-secondary{background:rgba(148,178,255,.06);color:var(--text);border-color:var(--border2)}
    .btn-secondary:hover{border-color:var(--brand-bd);background:rgba(148,178,255,.11);transform:translateY(-2px)}
    .btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2)}
    .btn-ghost:hover{color:var(--ink);border-color:var(--brand-bd)}

    /* ═══════════════ SHARED MOTION UTILITIES ═══════════════ */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1)}
    .reveal.in{opacity:1;transform:none}
    [data-tilt]{transform-style:preserve-3d;transition:transform .2s ease,box-shadow .22s ease,border-color .22s ease}
    .tilt-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;
      background:radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(150,190,255,.14), transparent 45%)}

    /* conic gradient border helper */
    .glow-border{position:relative}
    .glow-border::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:conic-gradient(from var(--a,0deg),transparent 0%,var(--brand) 20%,var(--brand-3) 40%,transparent 55%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;opacity:.0;transition:opacity .3s}
    .glow-border:hover::before,.glow-border.on::before{opacity:.9;animation:spin 4s linear infinite}
    @keyframes spin{to{--a:360deg}}
    @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

    ::-webkit-scrollbar{width:9px;height:9px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
    ::-webkit-scrollbar-thumb:hover{background:rgba(148,178,255,.32)}

    @media(prefers-reduced-motion:reduce){
      *{animation-duration:.001ms!important;transition-duration:.001ms!important}
      .reveal{opacity:1;transform:none}
    }

    @media(max-width:820px){
      nav{padding:0 18px}
      nav ul{display:none}
      .nav-burger{display:flex}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<!-- Aurora background -->
<div class="bg-fx" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="beam b1"></div>
  <div class="beam b2"></div>
  <div class="beam b3"></div>
</div>

<nav>
  <a class="nav-logo" href="/" aria-label="NiftyML home">
    <div class="nav-logo-mark">
      <svg width="16" height="16" viewBox="0 0 14 14" fill="none">
        <polyline points="1,10 4,6 7,8 10,3 13,5" stroke="#04070D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="nav-logo-text">Nifty<span class="ml">ML</span></span>
  </a>

  <ul>
    <li><a href="/" {% if active=='home' %}class="active"{% endif %}>Overview</a></li>
    <li><a href="/dashboard" {% if active=='dashboard' %}class="active"{% endif %}>Dashboard</a></li>
    <li><a href="/chat" class="nav-cta {% if active=='chat' %}active{% endif %}">AI Analyst</a></li>
  </ul>

  <button class="nav-burger" id="nav-burger" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-panel" id="mobile-panel">
  <a href="/" {% if active=='home' %}class="active"{% endif %}>Overview</a>
  <a href="/dashboard" {% if active=='dashboard' %}class="active"{% endif %}>Dashboard</a>
  <a href="/chat" {% if active=='chat' %}class="active"{% endif %}>AI Analyst</a>
</div>

<main>{% block content %}{% endblock %}</main>

<!-- ═══════════════ SHARED SCRIPTS ═══════════════ -->
<script>
/* Mobile menu */
(function(){
  const b=document.getElementById('nav-burger');
  const p=document.getElementById('mobile-panel');
  if(!b||!p) return;
  b.addEventListener('click',()=>{
    const open=b.classList.toggle('open');
    p.classList.toggle('open',open);
    b.setAttribute('aria-expanded',open);
  });
})();

/* Reveal on scroll */
(function(){
  const els=document.querySelectorAll('.reveal');
  if(!els.length) return;
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
  },{threshold:.15});
  els.forEach(el=>io.observe(el));
})();

/* 3D magnetic tilt for any [data-tilt] element */
(function(){
  const cards=document.querySelectorAll('[data-tilt]');
  if(!cards.length||window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const MAX=8;
  cards.forEach(card=>{
    card.style.position=card.style.position||'relative';
    let glare=card.querySelector('.tilt-glare');
    if(!glare){glare=document.createElement('div');glare.className='tilt-glare';card.appendChild(glare)}
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      const rx=(py-.5)*-2*MAX, ry=(px-.5)*2*MAX;
      card.style.transform=`perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
      glare.style.setProperty('--gx',(px*100)+'%');
      glare.style.setProperty('--gy',(py*100)+'%');
      glare.style.opacity='1';
    });
    card.addEventListener('pointerleave',()=>{card.style.transform='';glare.style.opacity='0'});
  });
})();

/* Count-up for [data-countup]: data-to, data-dec, data-prefix, data-suffix */
window.__countUp=function(el){
  const to=parseFloat(el.dataset.to), dec=parseInt(el.dataset.dec||'0',10);
  const pre=el.dataset.prefix||'', suf=el.dataset.suffix||'';
  const dur=1000, t0=performance.now();
  function tick(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.textContent=pre+(to*e).toFixed(dec)+suf;
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};
(function(){
  const nums=document.querySelectorAll('[data-countup]');
  if(!nums.length) return;
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(e=>{if(e.isIntersecting){window.__countUp(e.target);io.unobserve(e.target)}});
  },{threshold:.5});
  nums.forEach(n=>io.observe(n));
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
