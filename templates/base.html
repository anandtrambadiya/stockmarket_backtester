<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NiftyML{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:       #FAFAFA;
      --bg2:      #F4F4F5;
      --bg3:      #E4E4E7;
      --surface:  #FFFFFF;
      --border:   #E4E4E7;
      --border2:  #D4D4D8;
      --ink:      #09090B;
      --ink2:     #18181B;
      --text:     #09090B;
      --text2:    #71717A;
      --text3:    #A1A1AA;
      --green:    #16A34A;
      --green-bg: #F0FDF4;
      --green-bd: #BBF7D0;
      --red:      #DC2626;
      --red-bg:   #FEF2F2;
      --mono:     'JetBrains Mono',monospace;
      --sans:     'Inter',sans-serif;
      --radius:   10px;
      --shadow-sm:0 1px 2px rgba(0,0,0,.06);
      --shadow:   0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
      --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05);
    }
    html,body{height:100%;scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

    /* NAV */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:500;
      height:56px;display:flex;align-items:center;justify-content:space-between;
      padding:0 32px;
      background:rgba(250,250,250,0.85);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
    }
    .nav-logo{
      display:flex;align-items:center;gap:8px;
      text-decoration:none;
    }
    .nav-logo-mark{
      width:28px;height:28px;border-radius:7px;
      background:var(--ink);
      display:flex;align-items:center;justify-content:center;
    }
    .nav-logo-mark svg{display:block}
    .nav-logo-text{
      font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;
    }
    nav ul{display:flex;gap:2px;list-style:none;align-items:center}
    nav a{
      display:block;padding:5px 12px;border-radius:6px;
      font-size:13px;font-weight:500;color:var(--text2);
      text-decoration:none;transition:all .12s;
    }
    nav a:hover{color:var(--text);background:var(--bg2)}
    nav a.active{color:var(--text);background:var(--bg2);font-weight:600}
    .nav-cta{
      background:var(--ink);color:#fff!important;border-radius:7px;
      padding:6px 14px!important;font-weight:600!important;font-size:12px!important;
      transition:opacity .15s!important;
    }
    .nav-cta:hover{opacity:.85;background:var(--ink)!important}

    main{padding-top:56px}

    /* SHARED */
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:9px 18px;border-radius:8px;font-size:13px;
      font-weight:600;font-family:var(--sans);cursor:pointer;
      text-decoration:none;border:none;transition:all .15s;
    }
    .btn-primary{background:var(--ink);color:#fff}
    .btn-primary:hover{opacity:.85;transform:translateY(-1px);box-shadow:var(--shadow-md)}
    .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border2)}
    .btn-secondary:hover{border-color:var(--ink);background:var(--bg2)}
    .btn-green{background:var(--green);color:#fff}
    .btn-green:hover{opacity:.9;transform:translateY(-1px)}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

    @media(max-width:768px){
      nav{padding:0 20px}
      nav ul .hide-mobile{display:none}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-logo" href="/">
    <div class="nav-logo-mark">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <polyline points="1,10 4,6 7,8 10,3 13,5" stroke="#4ADE80" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="nav-logo-text">NiftyML</span>
  </a>
  <ul>
    <li class="hide-mobile"><a href="/" {% if active=='home' %}class="active"{% endif %}>Overview</a></li>
    <li class="hide-mobile"><a href="/dashboard" {% if active=='dashboard' %}class="active"{% endif %}>Dashboard</a></li>
    <li><a href="/chat" class="nav-cta {% if active=='chat' %}active{% endif %}">AI Report</a></li>
  </ul>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
